name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest genvm-linter
      - name: Direct suite
        run: python -m pytest tests/direct -q
      - name: GenVM lint
        # `check`'s validate stage loads the linter's bundled SDK, which
        # ships only the newest runner — the one Studio Next currently
        # REJECTS ("invalid_contract runner malformed", receipt in
        # docs/PROBE-REPORT.md). The contract pins the runner the network
        # actually serves, so validate cannot load it; the AST lint pass
        # runs in full.
        run: genvm-lint lint contracts/isobar.py --json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npx next build
