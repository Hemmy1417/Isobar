networks:
  # The boilerplate's default. Direct-mode tests use no network at all, so
  # `pytest tests/direct` needs no keys or environment.
  default: localnet

  localnet:
    url: "http://127.0.0.1:4000/api"

  # Integration target: `gltest tests/integration --network studio_devnet`.
  # genlayer-py's studio_devnet preset IS chain 61997 (Consensus v0.6);
  # pointed at the Studio Next endpoint. The funded test key is injected by
  # tests/integration/conftest.py from ISOBAR_TEST_PRIVATE_KEY (.env, gitignored).
  studio_devnet:
    url: "https://studio-next.genlayer.com/api"
    default_wait_interval: 4000
    default_wait_retries: 150

paths:
  contracts: "contracts"

environment: .env
